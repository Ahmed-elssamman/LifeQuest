    <radialGradient id="glow"><stop stop-color="#9e7cef" stop-opacity=".28"/><stop offset="1" stop-color="#9e7cef" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d3c4ff" opacity=".1"/></pattern>
  </defs>
